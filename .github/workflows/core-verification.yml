name: FIKRADO Core Verification

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "core/**"
      - "app/**"
      - "media/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle*"
      - "build.gradle*"
      - "gradle.properties"
      - ".github/workflows/core-verification.yml"
  pull_request:
    paths:
      - "core/**"
      - "app/**"
      - "media/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle*"
      - "build.gradle*"
      - "gradle.properties"
      - ".github/workflows/core-verification.yml"

permissions:
  contents: read

concurrency:
  group: fikrado-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core JVM tests and Android app compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run render queue regression tests
        run: ./gradlew :core:test --tests '*RenderQueueTest' --no-daemon --stacktrace

      - name: Run full core tests
        run: ./gradlew :core:test --no-daemon --stacktrace

      - name: Fetch pinned FFmpeg runtime
        run: bash scripts/fetch-ffmpeg-kit-next.sh

      - name: Fetch pinned Sherpa ONNX runtime
        run: bash scripts/fetch-sherpa-onnx.sh

      - name: Compile Android app Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Run Android production factory unit tests
        run: ./gradlew :app:testDebugUnitTest --tests '*AndroidFfmpegProductionJobFactoryTest' --no-daemon --stacktrace

      - name: Upload Android unit-test reports (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fikrado-android-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fikrado-studio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
