name: FIKRADO Core Verification

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "core/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle*"
      - "build.gradle*"
      - "gradle.properties"
      - ".github/workflows/core-verification.yml"
  pull_request:
    paths:
      - "core/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle*"
      - "build.gradle*"
      - "gradle.properties"
      - ".github/workflows/core-verification.yml"

permissions:
  contents: read

concurrency:
  group: fikrado-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run core tests
        run: ./gradlew :core:test --no-daemon --stacktrace
